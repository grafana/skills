name: Validate gcx Invocations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      gcx-version:
        description: Override the pinned gcx version (for testing a bump before changing .gcx-version)
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-gcx:
    runs-on: ubuntu-latest
    env:
      VERSION_OVERRIDE: ${{ inputs.gcx-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve pinned gcx version
        id: version
        run: |
          VERSION="${VERSION_OVERRIDE:-$(cat .gcx-version)}"
          echo "Using gcx v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download and verify gcx
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl -fsSLO "https://github.com/grafana/gcx/releases/download/v${VERSION}/gcx_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/grafana/gcx/releases/download/v${VERSION}/gcx_${VERSION}_checksums.txt"
          grep "linux_amd64.tar.gz" "gcx_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gcx_${VERSION}_linux_amd64.tar.gz" gcx
          ./gcx version

      - name: Validate gcx invocations in skills
        run: python3 scripts/validate-gcx-invocations.py --gcx-bin ./gcx skills
