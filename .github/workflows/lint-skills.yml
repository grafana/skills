name: Lint Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make lint script executable
        run: chmod +x scripts/lint-skills.sh

      - name: Lint skills
        run: |
          SKILL_COUNT=$(find skills -name "SKILL.md" -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$SKILL_COUNT" -eq 0 ]; then
            echo "No SKILL.md files found — nothing to lint"
            exit 0
          fi
          ./scripts/lint-skills.sh skills
