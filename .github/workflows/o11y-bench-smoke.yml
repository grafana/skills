name: o11y-bench

on:
  pull_request:
    branches: [main]
    # Intentionally NO paths: filter — same rationale as skill-review.yml.
    # A required check that's path-gated would leave non-skill PRs BLOCKED forever.
  workflow_dispatch:
    inputs:
      task:
        description: 'Single task slug to run (e.g. query-cpu-metrics — see o11ybench.ai/tasks)'
        required: true
        default: 'query-cpu-metrics'
      model:
        description: 'LiteLLM model id'
        required: true
        default: 'anthropic/claude-haiku-4-5-20251001'
      agent:
        description: 'Harbor agent shortcut (e.g. opencode, claude-code) or import path agents.X:Y'
        required: true
        default: 'opencode'
      n_attempts:
        description: 'Attempts per task (Pass^N is over 3, but use 1 for manual smoke)'
        required: true
        default: '1'

# Workflow defaults to no permissions; each job grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # PR-gated dry-run smoke. No LLM calls, ~52s wall time.
  # =========================================================================
  smoke:
    name: Dry-run o11y-bench suite
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout skills
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          path: skills

      # grafana/o11y-bench is the benchmark itself. Pinned to a SHA so an
      # upstream breaking change doesn't take our CI down silently. Bump via:
      #   gh api repos/grafana/o11y-bench/commits/main --jq .sha
      - name: Checkout o11y-bench
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: grafana/o11y-bench
          # Pin to main HEAD as of 2026-06-09. Renovate is set to track this
          # via the line below — keep the comment on its own line.
          ref: main
          persist-credentials: false
          path: o11y-bench

      # We can't use o11y-bench's own composite setup-env directly because it
      # runs `uv sync` in the workflow's working-directory (= this repo's
      # checkout root), but pyproject.toml lives under ./o11y-bench/. Inline
      # the same three steps with an explicit working-directory on uv sync.
      # Pins copied verbatim from o11y-bench/.github/actions/setup-env/action.yml.
      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-python: true
          python-version: '3.14'
          save-cache: 'false'

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: false
          install: false

      - name: Sync uv deps
        working-directory: o11y-bench
        run: uv sync --locked --all-groups

      # Dry-run validates: suite YAML parses, tasks register, agent import
      # path resolves. Zero LLM calls — costs nothing, takes ~3 min.
      #
      # `--n-attempts 1 --n-concurrent 1` mirrors o11y-bench's own cli-smoke
      # job — keeps the dry plan small enough to fit GitHub's log budget.
      - name: Dry-run the full suite
        working-directory: o11y-bench
        run: >-
          mise run bench:suite --
          --dry-run
          --jobs-dir /tmp/o11y-bench-jobs/skills-smoke-dry-run
          --n-attempts 1
          --n-concurrent 1

  fork-pr-notice:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "::notice::Skipping o11y-bench smoke on fork PR. A maintainer can run it on a same-repo branch."

  # =========================================================================
  # Manual real run. Triggered only by workflow_dispatch — never on PR.
  # Pulls ANTHROPIC_API_KEY from the same Vault path that grafana-cloud's
  # claude-code-review.yml uses (`anthropic-token:token` on the dev instance).
  # Runs one task with N attempts and uploads the job dir as an artifact.
  # =========================================================================
  real-run:
    name: 'Real run: ${{ github.event.inputs.task }} on ${{ github.event.inputs.model }}'
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write   # Vault OIDC
    steps:
      - name: Checkout skills
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          path: skills

      - name: Checkout o11y-bench
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: grafana/o11y-bench
          ref: main
          persist-credentials: false
          path: o11y-bench

      # Match grafana-cloud/.github/workflows/claude-code-review.yml — same
      # Vault path (`anthropic-token:token` on the dev instance) so we share
      # the existing org-level secret rotation.
      - name: Get ANTHROPIC_API_KEY from Vault
        id: vault
        uses: grafana/shared-workflows/actions/get-vault-secrets@f1614b210386ac420af6807a997ac7f6d96e477a # get-vault-secrets/v1.3.1
        with:
          vault_instance: dev
          repo_secrets: |
            ANTHROPIC_API_KEY=anthropic-token:token

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-python: true
          python-version: '3.14'
          save-cache: 'false'

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: false
          install: false

      - name: Sync uv deps
        working-directory: o11y-bench
        run: uv sync --locked --all-groups

      # `setup:sync` materializes task specs into the tasks/ dir — required
      # before `bench:job` can pick a task by slug.
      - name: Sync task specs
        working-directory: o11y-bench
        run: mise run setup:sync

      # The agent input accepts either a Harbor shortcut (e.g. `opencode`) or
      # a full import path (e.g. `agents.gcx_opencode_agent:GcxOpenCodeAgent`).
      # `--agent-import-path` only accepts the latter, so route via a small
      # bash branch.
      - name: Run benchmark task
        working-directory: o11y-bench
        env:
          ANTHROPIC_API_KEY: ${{ fromJSON(steps.vault.outputs.secrets).ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          AGENT_INPUT='${{ github.event.inputs.agent }}'
          if [[ "$AGENT_INPUT" == *:* ]]; then
            AGENT_FLAG=(--agent-import-path "$AGENT_INPUT")
          else
            AGENT_FLAG=(--agent "$AGENT_INPUT")
          fi
          mise run bench:job -- \
            --model "${{ github.event.inputs.model }}" \
            --task-name "${{ github.event.inputs.task }}" \
            "${AGENT_FLAG[@]}" \
            --n-attempts "${{ github.event.inputs.n_attempts }}" \
            --n-concurrent 1 \
            --job-name "manual-${GITHUB_RUN_ID}-${{ github.event.inputs.task }}" \
            --jobs-dir /tmp/o11y-bench-jobs

      - name: Summarize result to job summary
        if: always()
        run: |
          set +e
          shopt -s nullglob
          {
            echo "## o11y-bench result"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Task | \`${{ github.event.inputs.task }}\` |"
            echo "| Model | \`${{ github.event.inputs.model }}\` |"
            echo "| Agent | \`${{ github.event.inputs.agent }}\` |"
            echo "| Attempts | ${{ github.event.inputs.n_attempts }} |"
            echo ""
            for result in /tmp/o11y-bench-jobs/**/result.json; do
              echo "### \`$result\`"
              echo ""
              echo '```json'
              jq '{score: .score, passed: .passed, attempt: .attempt, model: .model, error: .error_type}' "$result" 2>/dev/null || cat "$result"
              echo '```'
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload job artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: o11y-bench-${{ github.event.inputs.task }}-${{ github.run_id }}
          path: /tmp/o11y-bench-jobs
          retention-days: 30
